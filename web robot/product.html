<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - RobotRizz</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0c0e10;
    --navy2: #181a1f;
    --navy3: #22252b;
    --blue: #1e3a8a;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --cyan: #0891b2;
    --white: #f0f6ff;
    --muted: #94a3b8;
    --glow: 0 0 20px rgba(8,145,178,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Mono', monospace;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(8,145,178,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(8,145,178,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,14,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(8,145,178,0.15);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(8,145,178,0.5);
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-img {
    height: 50px;
    width: auto;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
    transition: color 0.3s;
  }

  .back-btn:hover { color: var(--cyan); }

  /* MAIN */
  .product-page {
    padding: 6rem 2rem 4rem;
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* GALLERY */
  .gallery {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    margin-bottom: 3rem;
  }

  .gallery-main {
    width: 100%;
    aspect-ratio: 16/10;
    background: var(--navy2);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }

  .gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }

  .gallery-main:hover img {
    transform: scale(1.02);
  }

  .gallery-main .zoom-hint {
    position: absolute;
    bottom: 1rem;
    right: 1rem;
    background: rgba(0,0,0,0.6);
    color: var(--white);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.7rem;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .gallery-main:hover .zoom-hint { opacity: 1; }

  .gallery-thumbs {
    display: flex;
    gap: 0.75rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }

  .gallery-thumb {
    width: 100px;
    height: 70px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.3s;
    background: var(--navy2);
  }

  .gallery-thumb:hover,
  .gallery-thumb.active {
    border-color: var(--cyan);
  }

  .gallery-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
  }

  .lightbox-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--white);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
  }

  .lightbox-close:hover { background: rgba(255,255,255,0.2); }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--white);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
  }

  .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
  .lightbox-prev { left: 1rem; }
  .lightbox-next { right: 1rem; }

  /* INFO */
  .product-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
  }

  @media (max-width: 768px) {
    .product-info { grid-template-columns: 1fr; }
  }

  .product-details h1 {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: var(--white);
  }

  .product-tag {
    display: inline-block;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: var(--accent2);
    padding: 4px 12px;
    border-radius: 100px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  .product-tag.cyan {
    background: rgba(34,211,238,0.1);
    border-color: rgba(34,211,238,0.3);
    color: var(--cyan);
  }

  .product-tag.green {
    background: rgba(34,197,94,0.1);
    border-color: rgba(34,197,94,0.3);
    color: #4ade80;
  }

  .product-tag.purple {
    background: rgba(139,92,246,0.1);
    border-color: rgba(139,92,246,0.3);
    color: #a78bfa;
  }

  .product-desc {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.8;
  }

  /* DOWNLOAD */
  .product-download {
    background: var(--navy2);
    border: 1px solid rgba(34,211,238,0.15);
    border-radius: 16px;
    padding: 2rem;
  }

  .product-download h2 {
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    margin-bottom: 1.5rem;
    color: var(--white);
  }

  .download-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
    background: var(--navy3);
    border-radius: 8px;
    margin-bottom: 0.75rem;
  }

  .download-item:last-child { margin-bottom: 0; }

  .download-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .download-icon {
    width: 40px;
    height: 40px;
    background: rgba(34,211,238,0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cyan);
    font-size: 1.2rem;
  }

  .download-name {
    font-size: 0.85rem;
    color: var(--white);
  }

  .download-size {
    font-size: 0.7rem;
    color: var(--muted);
  }

  .download-btn {
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    color: var(--navy);
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.75rem;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 15px rgba(34,211,238,0.3);
  }

  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px rgba(8,145,178,0.5);
  }

  /* IMAGES GRID */
  .images-grid {
    margin-top: 3rem;
  }

  .images-grid h2 {
    font-family: 'Orbitron', monospace;
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    color: var(--white);
  }

  .images-grid .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  .images-grid .grid-item {
    aspect-ratio: 16/10;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: var(--navy2);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .images-grid .grid-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .images-grid .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* NOT FOUND */
  .not-found {
    text-align: center;
    padding: 4rem 2rem;
  }

  .not-found h1 {
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    margin-bottom: 1rem;
    color: var(--cyan);
  }

  .not-found p {
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .not-found a {
    background: linear-gradient(135deg, var(--accent), var(--cyan));
    color: var(--navy);
    padding: 12px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.8rem;
  }

  @media (max-width: 768px) {
    .gallery-thumbs { gap: 0.5rem; }
    .gallery-thumb { width: 80px; height: 56px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="logo" href="robotrizz.html">
    <img src="robotrizzbetter.png" alt="RobotRizz Logo" class="logo-img">
  </a>
  <a href="robotrizz.html" class="back-btn">
    ← Back to Home
  </a>
</nav>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">‹</button>
  <img id="lightboxImg" src="" alt="Full size">
  <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">›</button>
</div>

<!-- PRODUCT CONTENT -->
<div class="product-page" id="productContent">
  <!-- Content loaded by JS -->
</div>

<script>
// Product data - each item has multiple images and download files
const products = {
  // ROBOTS
  robot1: {
    title: "Robot Build #1",
    tag: "WRO 2026 JUNIOR",
    tagClass: "cyan",
    description: "Your first robot project. This autonomous robot features advanced navigation algorithms and precision sensor integration. Built for the WRO 2026 season, it showcases innovative mechanical design and robust programming.",

      { name: "Robot_Build.io", size: "291 KB", file: "files/robot1_model.io" },
      //{ name: "Schematics.pdf", size: "1.8 MB", file: "files/robot1_schematics.pdf" }
    ]
  },
  robot2: {
    title: "Robot Build #2",
    tag: "WRO 2026 JUNIOR",
    tagClass: "cyan",
    description: "Describe your second build. What makes it special? What did you learn? This servo-driven robot demonstrates advanced motor control and precision movement systems.",
    images: ["rb2/robot2_1.png", "rb2/robot2_2.mp4", "rb2/robot2_3.png"],
    downloads: [
      { name: "Robot_Build.io", size: "525 KB", file: "files/robot2_model.io" },
      //{ name: "Code_Base.zip", size: "156 KB", file: "files/robot2_code.zip" }
    ]
  },
  robot3: {
    title: "Robot Build #3",
    tag: "in progress",
    tagClass: "cyan",
    description: "Add your next robot. Customize the icon, title, and description above. Currently in development for the upcoming competition season.",
    images: ["robot3_1.png", "robot3_2.png", "robot3_3.png", "robot3_4.png"],
    downloads: [
      { name: "WIP_Assembly.stl", size: "4.2 MB", file: "files/robot3_wip.stl" }
    ]
  },
  robot4: {
    title: "Coming Soon",
    tag: "upcoming",
    tagClass: "",
    description: "Something big is in the workshop. Stay tuned and subscribe on YouTube for updates.",
    images: ["robot4_1.png", "robot4_2.png"],
    downloads: []
  },

  // CODE
  code1: {
    title: "Pybricks Block Color Reading",
    tag: "Pybricks/Python",
    tagClass: "green",
    description: "Add your code project here. This Python robot controller provides a comprehensive framework for autonomous robot behavior, including sensor fusion, path planning, and real-time control systems.",
    images: ["code1/code1_1.png"],
    downloads: [
      { name: "Color_Reading_Algorithm.py", size: "1.78 KB", file: "files/Color_Reading_Algorithm.py" },
      //{ name: "README.pdf", size: "890 KB", file: "files/code1_readme.pdf" }
    ]
  },
  code2: {
    title: "Pybricks Block Color Reading",
    tag: "Pybricks/Block",
    tagClass: "green",
    description: "Replace this with your actual project. This AI vision script uses computer vision and machine learning for object detection and environmental awareness.",
    images: ["code2/code2_1.png", "code2_2.png", "code2_3.png", "code2_4.png"],
    downloads: [
      { name: "vision_model.py", size: "18 KB", file: "files/vision_model.py" },
      { name: "trained_weights.pkl", size: "45 MB", file: "files/vision_weights.pkl" }
    ]
  },
  code3: {
    title: "Game Bot",
    tag: "Arduino",
    tagClass: "green",
    description: "A bot that plays games so you don't have to. This Arduino-based game bot uses computer vision to analyze game state and make decisions.",
    images: ["code3_1.png", "code3_2.png", "code3_3.png", "code3_4.png"],
    downloads: [
      { name: "game_bot_arduino.ino", size: "12 KB", file: "files/game_bot.ino" }
    ]
  },
  code4: {
    title: "More Scripts",
    tag: "Open Source",
    tagClass: "green",
    description: "More code coming. Check out the YouTube channel for code walkthroughs and updates on new projects.",
    images: ["code4_1.png", "code4_2.png"],
    downloads: []
  },

  // DESIGN
  design1: {
    title: "Robot 3D Model",
    tag: "3D / CAD",
    tagClass: "purple",
    description: "Paste in your design work here. This 3D model was designed in Fusion 360 and optimized for 3D printing. Includes all components and assembly instructions.",
    images: ["design1_1.png", "design1_2.png", "design1_3.png", "design1_4.png"],
    downloads: [
      { name: "Robot_Model_Final.stl", size: "8.5 MB", file: "files/robot_model.stl" },
      { name: "Fusion_360_Archive.f3d", size: "12 MB", file: "files/robot_fusion.f3d" }
    ]
  },
  design2: {
    title: "Circuit Schematic",
    tag: "Electronics",
    tagClass: "purple",
    description: "Share your circuit designs, wiring diagrams, or blueprints. This comprehensive schematic shows all connections and component specifications.",
    images: ["design2_1.png", "design2_2.png", "design2_3.png", "design2_4.png"],
    downloads: [
      { name: "Circuit_Schematic.pdf", size: "2.1 MB", file: "files/schematic.pdf" },
      { name: "BOM.xlsx", size: "45 KB", file: "files/bill_of_materials.xlsx" }
    ]
  },
  design3: {
    title: "UI / Interface",
    tag: "UI Design",
    tagClass: "purple",
    description: "Any custom dashboards or interfaces you've designed for your robots go here. Features real-time telemetry and control capabilities.",
    images: ["design3_1.png", "design3_2.png", "design3_3.png", "design3_4.png"],
    downloads: [
      { name: "Dashboard_UI.fig", size: "4.2 MB", file: "files/dashboard.fig" }
    ]
  },
  design4: {
    title: "Concept Art",
    tag: "Concept",
    tagClass: "purple",
    description: "Early sketches and concept ideas. The brainstorming that happens before the build. These concepts explore various design directions.",
    images: ["design4_1.png", "design4_2.png", "design4_3.png", "design4_4.png"],
    downloads: [
      { name: "Concept_Sketches.pdf", size: "5.6 MB", file: "files/concepts.pdf" }
    ]
  },

  // RANDOM
  random1: {
    title: "Things I Tried",
    tag: "experiments",
    tagClass: "",
    description: "Experiments that worked, experiments that exploded. All equally educational. Documenting the journey of trial and error.",
    images: ["random1_1.png", "random1_2.png", "random1_3.png", "random1_4.png"],
    downloads: [
      { name: "Experiment_Log.pdf", size: "1.2 MB", file: "files/experiments.pdf" }
    ]
  },
  random2: {
    title: "Latest Video",
    tag: "youtube",
    tagClass: "",
    description: "Embed or link your latest YouTube video here. Keep visitors in the loop with the newest content from the channel.",
    images: ["random2_1.png", "random2_2.png", "random2_3.png", "random2_4.png"],
    downloads: []
  },
  random3: {
    title: "Wild Card",
    tag: "chaos",
    tagClass: "",
    description: "No rules here. Go wild. This card can be whatever you want it to be. The sky's the limit.",
    images: ["random3_1.png", "random3_2.png", "random3_3.png", "random3_4.png"],
    downloads: [
      { name: "Chaos_File.zip", size: "500 KB", file: "files/chaos.zip" }
    ]
  }
};

let currentImageIndex = 0;
let currentImages = [];

// Get item from URL
const params = new URLSearchParams(window.location.search);
const item = params.get('item');

// Load product
const container = document.getElementById('productContent');

if (item && products[item]) {
  const product = products[item];
  currentImages = product.images;

  container.innerHTML = `
    <div class="gallery">
      <div class="gallery-main" onclick="openLightbox(0)">
        <img id="mainImage" src="${product.images[0]}" alt="${product.title}">
        <span class="zoom-hint">Click to enlarge</span>
      </div>
      <div class="gallery-thumbs" id="thumbs"></div>
    </div>

    <div class="product-info">
      <div class="product-details">
        <h1>${product.title}</h1>
        <span class="product-tag ${product.tagClass}">${product.tag}</span>
        <p class="product-desc">${product.description}</p>
      </div>
      <div class="product-download">
        <h2>📥 Download Files</h2>
        ${product.downloads.length > 0 ? product.downloads.map(d => `
          <div class="download-item">
            <div class="download-info">
              <div class="download-icon">📄</div>
              <div>
                <div class="download-name">${d.name}</div>
                <div class="download-size">${d.size}</div>
              </div>
            </div>
            <a href="${d.file}" class="download-btn" download>Download</a>
          </div>
        `).join('') : '<p style="color: var(--muted); font-size: 0.85rem;">No files available for download yet.</p>'}
      </div>
    </div>

    <div class="images-grid">
      <h2>📷 More Images</h2>
      <div class="grid">
        ${product.images.map((img, i) => `
          <div class="grid-item" onclick="openLightbox(${i})">
            <img src="${img}" alt="${product.title} ${i + 1}">
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Generate thumbnails
  const thumbsContainer = document.getElementById('thumbs');
  product.images.forEach((img, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'gallery-thumb' + (i === 0 ? ' active' : '');
    thumb.innerHTML = `<img src="${img}" alt="Thumbnail ${i + 1}">`;
    thumb.onclick = () => selectImage(i);
    thumbsContainer.appendChild(thumb);
  });

} else {
  container.innerHTML = `
    <div class="not-found">
      <h1>Product Not Found</h1>
      <p>The item you're looking for doesn't exist or has been removed.</p>
      <a href="robotrizz.html">← Back to Home</a>
    </div>
  `;
}

function selectImage(index) {
  currentImageIndex = index;
  document.getElementById('mainImage').src = currentImages[index];
  document.querySelectorAll('.gallery-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });
}

function openLightbox(index) {
  currentImageIndex = index;
  document.getElementById('lightboxImg').src = currentImages[index];
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navigateLightbox(dir) {
  currentImageIndex = (currentImageIndex + dir + currentImages.length) % currentImages.length;
  document.getElementById('lightboxImg').src = currentImages[currentImageIndex];
}

// Close lightbox on escape or click outside
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigateLightbox(-1);
  if (e.key === 'ArrowRight') navigateLightbox(1);
});

document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});
</script>
</body>
</html>
